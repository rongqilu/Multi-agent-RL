name:  📦 Package Release

on:
  push:
    tags:
      - 'v*'          # 打标签触发
  workflow_dispatch:  # 手动触发选项
    inputs:
      changelog:
        description: |
          变更日志内容或文件路径：
          - 直接输入内容（用 \n 换行）
          - 或输入文件路径（如 .github/CHANGELOG.md）
        required: true
        default: '.github/CHANGELOG.md'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 获取足够的历史记录以包含标签
          fetch-depth: 0

      - name: Prepare shared files
        run: |
          mkdir -p shared_files
          cp README.md README_en.md img.png shared_files/

      - name: Prepare release body
        run: |
          # 创建基础模板
          cat << 'EOF' > base_body.md
          # 多模块独立发布包

          ## 模块介绍
          - **MADDPG_Continous**  
            多智能体深度确定性策略梯度算法（连续动作空间版本），适用于连续控制场景的多智能体协同训练。

          - **MATD3_Continous**  
            多智能体双延迟深度确定性策略梯度算法，在MADDPG基础上增加了延迟更新和策略平滑机制。

          - **HAPPO-MAPPO_Continous_Heterogeneous**  
            异质智能体近端策略优化算法，支持不同类型智能体的混合训练场景。

          - **MAPPO_Continous_Homogeneous**  
            同质智能体近端策略优化算法，针对同类型智能体的高效训练优化。

          - **RL_Learning-main**  
            赵世钰老师强化学习基础教程合集，包含经典算法实现和示例代码。

          - **hands_on_RL**  
            动手学强化学习实践项目，通过Jupyter Notebook提供互动式学习体验。

          ## 使用说明
          1. 点击下方所需模块的ZIP文件下载
          2. 解压后阅读README.md获取详细使用指南
          3. 安装依赖：`pip install -r requirements.txt`

          ## 支持渠道
          - [中文问题提交](https://github.com/Ronchy2000/Multi-agent-RL/issues/new?labels=zh)
          - 许可证：[MIT](LICENSE)

          ---

          # Independent Modules Release

          ## Available Modules
          -  **MADDPG_Continous**  
            Multi-Agent Deep Deterministic Policy Gradient (continuous action space version) for cooperative multi-agent control.

          - **MATD3_Continous**  
            Multi-Agent Twin Delayed DDPG, featuring delayed updates and policy smoothing.

          - **HAPPO-MAPPO_Continous_Heterogeneous**  
            Heterogeneous Agent Proximal Policy Optimization for mixed-type agent scenarios.

          - **MAPPO_Continous_Homogeneous**  
            Homogeneous Agent Proximal Policy Optimization for efficient training of same-type agents.

          - **RL_Learning-main**  
            Fundamental RL tutorials with classic algorithm implementations.

          - **hands_on_RL**  
            Interactive reinforcement learning projects via Jupyter Notebooks.

          ## Quick Start
          1. Download the desired module ZIP below
          2. Check README_en.md for detailed instructions
          3. Install dependencies: `pip install -r requirements.txt`

          ## Support
          - [English Issues](https://github.com/Ronchy2000/Multi-agent-RL/issues/new?labels=en)
          - License: [MIT](LICENSE)
          EOF
          
          # 获取触发类型
          TRIGGER_TYPE="${{ github.event_name }}"
          echo "触发类型: $TRIGGER_TYPE"
          
          # 确定变更日志来源
          if [[ "$TRIGGER_TYPE" == "workflow_dispatch" ]]; then
            # 手动触发：使用输入值
            INPUT_CHANGELOG="${{ github.event.inputs.changelog }}"
          else
            # 标签触发：使用默认文件
            INPUT_CHANGELOG=".github/CHANGELOG.md"
          fi
          
          echo "变更日志来源: $INPUT_CHANGELOG"
          
          # 检测输入是否是文件路径
          if [ -f "$INPUT_CHANGELOG" ]; then
            echo "从文件读取变更日志: $INPUT_CHANGELOG"
            CHANGELOG_CONTENT="$(cat "$INPUT_CHANGELOG")"

            # 如果使用分区维护的 CHANGELOG，则只提取“本次发布（上半部分）”区块，
            # 支持一次 release 包含多条 <a id> + 日期 + 条目。
            if [ "$INPUT_CHANGELOG" = ".github/CHANGELOG.md" ] && grep -q '<!-- RELEASE:START -->' "$INPUT_CHANGELOG"; then
              echo "检测到分区更新日志格式，提取本次发布区块"
              RELEASE_CHANGELOG_BLOCK="$(awk '
                /<!-- RELEASE:START -->/ { capture=1; next }
                /<!-- RELEASE:END -->/   { capture=0; exit }
                capture { print }
              ' "$INPUT_CHANGELOG")"

              if [ -n "$RELEASE_CHANGELOG_BLOCK" ]; then
                CHANGELOG_CONTENT="$(printf '## 更新日志（本次发布）\n\n%s\n\n> 完整历史记录请查看 [`.github/CHANGELOG.md`](https://github.com/%s/blob/%s/.github/CHANGELOG.md)。' "$RELEASE_CHANGELOG_BLOCK" "${{ github.repository }}" "${{ github.sha }}")"
              else
                echo "未能提取本次发布区块，回退为使用完整 CHANGELOG 内容"
              fi
            fi
          else
            echo "处理手动输入的变更日志"
            # 将 \n 替换为实际换行符
            CHANGELOG_CONTENT="${INPUT_CHANGELOG//\\n/$'\n'}"
          fi
          
          # 添加版本号标题
          VERSION="${{ github.ref_name }}"
          CHANGELOG_CONTENT="$(printf '# 版本 %s\n\n%s' "$VERSION" "$CHANGELOG_CONTENT")"

          # 创建完整的发布说明
          {
            printf '%s\n\n' '# 变更日志 / Changelog'
            printf '%s\n\n' "$CHANGELOG_CONTENT"
            printf '%s\n\n' '---'
            cat base_body.md
          } > full_body.md
          
          # 打印生成的内容用于调试
          echo "===== 生成的发布说明预览 ====="
          cat full_body.md  # 显示完整内容以便调试
          echo "====================================="

      - name: Package each folder
        run: |
          mkdir -p zips
          # 需要打包的文件夹列表
          TARGET_FOLDERS=(
            "MADDPG_Continous"
            "MATD3_Continous"
            "HAPPO-MAPPO_Continous_Heterogeneous"
            "MAPPO_Continous_Homogeneous"
            "RL_Learning-main"
            "动手学强化学习"   # 保留原始中文名称
          )

          for folder in "${TARGET_FOLDERS[@]}"; do
            if [ -d "$folder" ]; then
              # 为中文文件夹设置英文输出名称
              if [ "$folder" = "动手学强化学习" ]; then
                output_name="hands_on_RL"
              else
                output_name="$folder"
              fi
              
              # 创建临时目录
              mkdir -p "temp_$output_name"
              
              # 复制文件夹内容（保留原始结构）
              cp -r "$folder" "temp_$output_name/"
              
              # 添加共享文件
              cp shared_files/* "temp_$output_name/"
              
              # 打包为英文名称的ZIP
              (cd "temp_$output_name" && zip -r "../zips/$output_name.zip" .)
              echo "Packaged: $folder as $output_name.zip"
            else
              echo "Folder not found: $folder"
            fi
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body_path: full_body.md
          files: |
            zips/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
